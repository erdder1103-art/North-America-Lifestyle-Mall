    function buildRegionOptions(lang) {
      const select = document.getElementById("region");
      const current = select.value;
      const placeholder = select.querySelector(
        "option[data-i18n='form_region_placeholder']"
      );
      select.innerHTML = "";
      select.appendChild(placeholder);

      usStates.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s.value;
        opt.textContent = lang === "zh" ? s.zh : s.en;
        if (current && current === s.value) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });
    }

    let currentLang = "en";
    const LANG_STORAGE_KEY = "lifamall_lang";

    function saveLang(lang) {
      try {
        localStorage.setItem(LANG_STORAGE_KEY, lang);
      } catch {}
    }

    function loadLang() {
      try {
        return localStorage.getItem(LANG_STORAGE_KEY) || "en";
      } catch {
        return "en";
      }
    }

    const wheelImage = document.getElementById("wheelImage");
    const spinBtn = document.getElementById("spinBtn");
    const spinStatus = document.getElementById("spinStatus");
    const wheelCenter = document.getElementById("wheelCenter");
    const goToMallBtn = document.getElementById("goToMallBtn");

    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalCloseBtn = document.getElementById("modalCloseBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const modalPrizeText = document.getElementById("modalPrizeText");
    const claimForm = document.getElementById("claimForm");

    const confirmBackdrop = document.getElementById("confirmBackdrop");
    const confirmEditBtn = document.getElementById("confirmEditBtn");
    const confirmOkBtn = document.getElementById("confirmOkBtn");

    const successBackdrop = document.getElementById("successBackdrop");
    const successText = document.getElementById("successText");
    const successOkBtn = document.getElementById("successOkBtn");

    const langButtons = document.querySelectorAll(".lang-btn");

    let isSpinning = false;
    let currentRotation = 0;
    let lastPrize = null;
    let pendingFormData = null;
    let pendingSubmitEventId = null;

    if (goToMallBtn) {
      goToMallBtn.addEventListener("click", () => {
        const id = genEventId();
        trackPixel("ClickMallURL", { event_id: id });
        sendFbServerEvent("ClickMallURL", id, {});
      });
    }

    wheelCenter.addEventListener("click", () => {
      spinBtn.click();
    });

    function updateSpinAvailability() {
      const t = translations[currentLang];
      if (!isTestMode() && hasSpun()) {
        spinBtn.disabled = true;
        spinStatus.innerHTML = t.spin_used_message;
      } else {
        spinBtn.disabled = false;
      }
    }

    function showSuccessPopup(message) {
      successText.textContent = message;
      successBackdrop.style.display = "flex";
    }

    function hideSuccessPopup() {
      successBackdrop.style.display = "none";
    }

    successOkBtn.addEventListener("click", hideSuccessPopup);

    spinBtn.addEventListener("click", () => {
      if (isSpinning) return;

      if (!isTestMode() && hasSpun()) {
        const t = translations[currentLang];
        spinStatus.innerHTML = t.spin_used_message;
        return;
      }

      if (!isTestMode()) {
        markSpun();
      }

      const spinEventId = genEventId();
      trackPixel("StartSpin", { event_id: spinEventId });
      sendFbServerEvent("StartSpin", spinEventId, {});

      isSpinning = true;
      spinBtn.disabled = true;

      const t = translations[currentLang];
      spinStatus.textContent = t.spin_status_spinning;

      lastPrize = prizeConfig.find((p) => p.amount === 50);

      const baseSpins = 4 + Math.floor(Math.random() * 3);
      const fullRotation = baseSpins * 360;
      const side = Math.random() < 0.5 ? -1 : 1;
      const nearEdgeOffset = 20 + Math.random() * 8;
      const targetRotation = fullRotation + side * nearEdgeOffset;

      currentRotation = targetRotation;
      wheelImage.style.transition = "transform 3.2s ease-out";
      wheelImage.style.transform = "rotate(" + currentRotation + "deg)";

      setTimeout(() => {
        isSpinning = false;
        if (!isTestMode()) {
          spinBtn.disabled = true;
        } else {
          spinBtn.disabled = false;
        }

        const t2 = translations[currentLang];
        const msg = t2.spin_status_win.replace("{amount}", lastPrize.label);
        spinStatus.innerHTML = msg;

        openModal();
      }, 3300);
    });

    function openModal() {
      if (!lastPrize) return;
      const t = translations[currentLang];
      modalPrizeText.textContent =
        t.modal_subtitle_prefix + lastPrize.label + t.modal_subtitle_suffix;
      modalBackdrop.style.display = "flex";
      claimForm.reset();
      document.body.classList.add("modal-open");
    }

    function closeModal() {
      modalBackdrop.style.display = "none";
      document.body.classList.remove("modal-open");
    }

    modalCloseBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);

    claimForm.addEventListener("submit", (e) => {
      e.preventDefault();

      if (!lastPrize) {
        alert("System error. Please try again later.");
        return;
      }

      pendingSubmitEventId = genEventId();

      const regionSelect = claimForm.region;
      const regionText =
        regionSelect.options[regionSelect.selectedIndex].text.trim();

      pendingFormData = {
        prize: lastPrize ? lastPrize.label : "",
        lastName: claimForm.lastName.value.trim(),
        firstName: claimForm.firstName.value.trim(),
        email: claimForm.email.value.trim(),
        region: regionText,
        phone: claimForm.phone.value.trim()
      };

      confirmBackdrop.style.display = "flex";
    });

    confirmEditBtn.addEventListener("click", () => {
      pendingFormData = null;
      pendingSubmitEventId = null;
      confirmBackdrop.style.display = "none";
    });

    confirmOkBtn.addEventListener("click", () => {
      if (!pendingFormData || !lastPrize) {
        confirmBackdrop.style.display = "none";
        return;
      }

      const submitEventId = pendingSubmitEventId || genEventId();
      trackPixel("SubmitSpinForm", { event_id: submitEventId });
      sendFbServerEvent("SubmitSpinForm", submitEventId, {
        currency: "USD",
        value: 0
      });

      const gForm = document.getElementById("gsheetForm");
      gForm.elements["last_name"].value  = pendingFormData.lastName;
      gForm.elements["first_name"].value = pendingFormData.firstName;
      gForm.elements["email"].value      = pendingFormData.email;
      gForm.elements["region"].value     = pendingFormData.region;
      gForm.elements["phone"].value      = pendingFormData.phone;
      gForm.elements["lang"].value       = currentLang;
      gForm.elements["prize"].value      = pendingFormData.prize;
      gForm.elements["user_agent"].value = navigator.userAgent;

      console.log("Claim form data (to sheet):", {
        last_name: pendingFormData.lastName,
        first_name: pendingFormData.firstName,
        email: pendingFormData.email,
        region: pendingFormData.region,
        phone: pendingFormData.phone,
        lang: currentLang,
        prize: pendingFormData.prize,
        user_agent: navigator.userAgent
      });

      gForm.submit();

      const t = translations[currentLang];
      confirmBackdrop.style.display = "none";
      closeModal();
      showSuccessPopup(t.thankyou_message);
      pendingFormData = null;
      pendingSubmitEventId = null;
    });

    function applyLanguage(lang) {
      currentLang = lang;
      saveLang(lang);

      document.documentElement.lang =
        lang === "en" ? "en" : "zh-Hant";

      const t = translations[lang];
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (!t[key]) return;
        if (el === spinStatus) return;
        el.innerHTML = t[key];
      });

      buildRegionOptions(lang);
      updateSpinAvailability();
    }

    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const lang = btn.getAttribute("data-lang");
        langButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        applyLanguage(lang);

        if (lastPrize && spinStatus.innerHTML && !hasSpun()) {
          const t = translations[currentLang];
          const msg = t.spin_status_win.replace("{amount}", lastPrize.label);
          spinStatus.innerHTML = msg;
        }
      });
    });

    const initialLang = loadLang();
    applyLanguage(initialLang);
    langButtons.forEach((btn) => {
      if (btn.getAttribute("data-lang") === initialLang) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });
  </script>
